<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="medBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer precision geometric ring / circular nodes -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-dasharray="6 8" />
  <circle cx="100" cy="14" r="5" fill="#0284c7" />
  <circle cx="186" cy="100" r="5" fill="#38bdf8" />
  <circle cx="100" cy="186" r="5" fill="#0284c7" />
  <circle cx="14" cy="100" r="5" fill="#38bdf8" />

  <!-- Shield / Cross Clinical Core container -->
  <rect x="74" y="38" width="52" height="124" rx="26" fill="url(#medBlue)" filter="url(#softGlow)" />
  <rect x="38" y="74" width="124" height="52" rx="26" fill="url(#medBlue)" filter="url(#softGlow)" />

  <!-- Dynamic internal logistical flow / pulse cross nodes -->
  <circle cx="100" cy="100" r="26" fill="#ffffff" />
  <circle cx="100" cy="100" r="16" fill="url(#cyanAccent)" />
  <circle cx="100" cy="100" r="7" fill="#ffffff" />

  <!-- Precision alignment micro-crosshair ticks -->
  <line x1="100" y1="46" x2="100" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="142" x2="100" y2="154" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="100" x2="58" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="142" y1="100" x2="154" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
